server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    # bank.transaction.max-amount est fourni par le config-service ; sans lui, la validation de
    # BankTransactionProperties fait échouer le démarrage (aucune valeur locale de secours)
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  graphql:
    graphiql:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  ai:
    mcp:
      server:
        name: transaction-service
        version: 1.0.0
        type: SYNC

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

bank:
  # bank.transaction.max-amount vient du config-service (aucune valeur locale volontairement)
  clients:
    account-service:
      # Vide : account-service est résolu par son nom via Eureka. Renseigner une URL pour la forcer.
      url: ${ACCOUNT_SERVICE_URL:}

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
        ignore-exceptions:
          - ma.adria.bank.transaction.domain.ResourceNotFoundException
          - ma.adria.bank.transaction.domain.BusinessRuleException
  retry:
    instances:
      account-service:
        max-attempts: 3
        wait-duration: 200ms
        ignore-exceptions:
          - ma.adria.bank.transaction.domain.ResourceNotFoundException
          - ma.adria.bank.transaction.domain.BusinessRuleException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
