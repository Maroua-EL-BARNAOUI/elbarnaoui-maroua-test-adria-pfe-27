server:
  port: 8081

spring:
  application:
    name: account-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  graphql:
    graphiql:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  ai:
    mcp:
      server:
        name: account-service
        version: 1.0.0
        type: SYNC

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

bank:
  demo-data: true
