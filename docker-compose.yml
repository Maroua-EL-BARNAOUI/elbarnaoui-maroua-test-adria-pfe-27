# Plateforme complète :  docker compose up -d --build
# Points d'entrée : gateway http://localhost:8080 · Eureka http://localhost:8761 · Kafka localhost:9092
x-java-service: &java-service
  restart: unless-stopped
  networks: [bank]

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: bank-kafka
    networks: [bank]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 29092 : accès depuis les conteneurs ; 9092 : accès depuis la machine hôte
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  config-service:
    <<: *java-service
    build: { context: ., args: { MODULE: config-service } }
    image: bank/config-service
    ports: ["8888:8888"]
    healthcheck: &health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment: { PORT: 8888 }

  discovery-service:
    <<: *java-service
    build: { context: ., args: { MODULE: discovery-service } }
    image: bank/discovery-service
    ports: ["8761:8761"]
    healthcheck: *health
    environment: { PORT: 8761 }

  account-service:
    <<: *java-service
    build: { context: ., args: { MODULE: account-service } }
    image: bank/account-service
    ports: ["8081:8081"]
    environment:
      PORT: 8081
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka
    healthcheck: *health
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }

  transaction-service:
    <<: *java-service
    build: { context: ., args: { MODULE: transaction-service } }
    image: bank/transaction-service
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck: *health
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }

  notification-consumer:
    <<: *java-service
    build: { context: ., args: { MODULE: notification-consumer } }
    image: bank/notification-consumer
    ports: ["8084:8084"]
    environment:
      PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck: *health
    depends_on:
      kafka: { condition: service_healthy }

  gateway-service:
    <<: *java-service
    build: { context: ., args: { MODULE: gateway-service } }
    image: bank/gateway-service
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      EUREKA_URL: http://discovery-service:8761/eureka
    healthcheck: *health
    depends_on:
      discovery-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }

networks:
  bank:
