server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Configuration partagée servie aux autres micro-services (voir src/main/resources/config)
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info
